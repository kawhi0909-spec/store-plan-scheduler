<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>店鋪方案排期工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* 版面：頂部深藍列 + 依填寫順序排列的白卡；權益狀態用綠／琥珀／紅 */
:root{
  --navy:#1E2A4C; --navy2:#34477A; --accent:#1E2A4C; --ink:#34477A; --bg:#F4F6FC; --card:#FFFFFF;
  --green:#1E9E63; --green-soft:#E3F8EC; --amber:#B8860B; --amber-ink:#7A5A06; --amber-soft:#FBF1DC;
  --red:#C2412D; --red-soft:#FBE6E2; --ice:#EAEFF9; --track:#E4E9F5; --dash:#B9C3DD;
  --text:#1A2032; --muted:#667085; --line:#E1E6F2; --on-accent:#FFFFFF; --overlay:rgba(20,26,44,.45);
  --shadow:0 4px 16px rgba(30,42,76,.08); color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .eyebrow{font-size:11px;letter-spacing:.18em;color:#B9C7EA}
.topbar h1{margin:0;font-size:20px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--ice);color:var(--ink);font-weight:600}
.btn:hover{filter:brightness(.96)}
.topbar .btn{background:rgba(255,255,255,.14);color:#fff}
.topbar .btn.primary{background:#1E9E63;color:#fff}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{padding:12px 28px;font-size:16px}
.btn.ghost{background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--red);background:var(--red-soft)}
.btn.add{background:transparent;border:1px dashed var(--dash);color:var(--ink);width:100%;padding:7px}
main{max-width:1280px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px;scroll-margin-top:84px}
.item-card{scroll-margin-top:84px}
.card h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.field input[readonly]{background:var(--bg);color:var(--muted)}
input:focus,select:focus{outline:2px solid #9DB1E6;outline-offset:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.list-row{display:grid;gap:8px;align-items:center;margin-bottom:8px}
.list-row.work{grid-template-columns:26px 1fr 1.4fr 32px}
.list-row.region{grid-template-columns:26px 1fr 32px}
.list-row input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0;background:var(--card)}
.tag{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--ice);color:var(--ink);font-weight:700;font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:18px}
.opt-title{font-size:13px;font-weight:600;margin-bottom:6px}
.run-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.notice{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px}
.notice.warn{background:var(--amber-soft);color:var(--amber-ink)}
.notice.err{background:var(--red-soft);color:var(--red)}
.notice.info{background:var(--ice);color:var(--ink)}
.notice ul{margin:4px 0 0;padding-left:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
table{border-collapse:collapse;width:100%}
.summary td,.summary th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.summary th{font-size:12px;color:var(--muted);font-weight:600}
.summary td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{white-space:nowrap}
.summary a{color:var(--ink);text-decoration:none;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.under{background:var(--amber-soft);color:var(--amber)}
.pill.over{background:var(--red-soft);color:var(--red)}
.item-card{border-top:1px solid var(--line);padding:18px 0 6px}
.item-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.item-head h3{margin:0;font-size:15px}
.item-head .sub{font-size:12px;color:var(--muted)}
.usage{font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--track);margin:8px 0 10px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.under span{background:var(--amber)} .bar.over span{background:var(--red)}
.entries th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px}
.entries td{padding:3px 6px;border-top:1px solid var(--line)}
.entries select,.entries input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;background:var(--card)}
.entries td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:80px}
.entries tr.bad td{background:var(--red-soft)}
.entries-wrap{overflow-x:auto}
.entries{min-width:620px}
.item-warn{font-size:12px;color:var(--red);margin:6px 0}
.item-note{font-size:13px;font-weight:600;color:var(--amber-ink);background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:6px;padding:8px 12px;margin:8px 0}
.summary tr.flag td{background:var(--amber-soft)}
.pill.flag{background:var(--amber);color:#fff;margin-left:6px}
.jump{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer}
.notice.warn ul{margin-top:6px}
.add-row{margin:8px 0 4px;max-width:200px}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px}
.tag.wide{width:auto;padding:0 8px;white-space:nowrap}
.ai-slot{display:flex;align-items:center;gap:8px;min-width:0}
.ai-slot select{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--card)}
.info-table td,.info-table th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
.info-table th{color:var(--muted);font-size:12px}
.info-table td:nth-child(2){white-space:nowrap;font-weight:600}
.gridwrap{overflow:auto;max-height:75vh;border-radius:8px;border:1px solid var(--line)}
.mgrid{border-collapse:separate;border-spacing:0;font-size:12px}
.mgrid th,.mgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;white-space:pre-line;min-width:120px}
.mgrid thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;text-align:center}
.mgrid .sticky{position:sticky;left:0;background:var(--card);z-index:1;min-width:150px;font-weight:600}
.mgrid thead .sticky{z-index:3;background:var(--navy)}
.mgrid td.cat{background:var(--ice);font-weight:700;color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.mono{font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);color:var(--text);border-radius:12px;box-shadow:var(--shadow);padding:20px;max-width:420px;width:100%}
.modal p{margin:0 0 16px;white-space:pre-line}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);font-size:13px}
.toast.info{background:var(--ice);color:var(--ink)} .toast.err{background:var(--red-soft);color:var(--red)}
@media (max-width:520px){.topbar{padding:12px 16px}.topbar .actions{margin-left:0}}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">100室內設計・店鋪方案</div>
    <h1>店鋪方案排期工具</h1>
  </div>
  <div class="actions">
    <button class="btn" id="btnLoad">讀檔</button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button class="btn" id="btnSave">存檔</button>
    <button class="btn primary" id="btnExport">匯出 Excel</button>
  </div>
</header>

<main>
  <section class="card">
    <h2><span class="num">1</span>基本資料</h2>
    <div class="grid">
      <div class="field"><label>公司名稱</label><input id="fCompany" placeholder="請輸入公司全名"></div>
      <div class="field"><label>負責業務</label><input id="fSales" placeholder="請輸入業務名字"></div>
      <div class="field"><label>合約開始日</label><input id="fStart" type="date"></div>
      <div class="field"><label>合約結束日（自動，共365天）</label><input id="fEnd" readonly></div>
    </div>
    <div style="margin-top:16px">
      <div class="opt-title">方案</div>
      <div class="seg" id="planSeg"></div>
    </div>
    <div class="hint" id="windowHint"></div>
  </section>

  <section class="two">
    <div class="card">
      <h2><span class="num">2</span>客戶作品</h2>
      <div id="worksList"></div>
      <button class="btn add" id="addWork">＋ 新增作品</button>
      <div class="hint">連結可以之後再補；排在越前面的作品，優先用在有作品數上限的版位。</div>
    </div>
    <div class="card">
      <h2><span class="num">3</span>門市所在縣市</h2>
      <div id="regionsList"></div>
      <button class="btn add" id="addRegion">＋ 新增區域</button>
      <datalist id="cityList"></datalist>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">4</span>排程設定</h2>
    <div class="opts">
      <div><div class="opt-title">置頂類（作品／公司列表置頂）</div><div class="seg" data-opt="pinMode"></div></div>
      <div><div class="opt-title">品牌曝光類的時間分布</div><div class="seg" data-opt="expoMode"></div></div>
      <div><div class="opt-title">品牌曝光類之間</div><div class="seg" data-opt="expoStagger"></div></div>
    </div>
    <div class="run-row">
      <button class="btn primary big" id="btnRun">一鍵自動排程</button>
      <span class="hint" style="margin:0">從合約開始日後的第一個週一起排，以週為單位，把權益全部用完。</span>
    </div>
    <div id="runMsg"></div>
  </section>

  <section class="card" id="result">
    <div class="tabs" id="tabs">
      <button data-tab="detail" class="on">權益明細（可微調）</button>
      <button data-tab="grid">月份總覽</button>
    </div>
    <div id="resultBody"></div>
  </section>
</main>

/* ================= 日期工具（以 UTC 日數計） ================= */
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const fmt = n => { const d = new Date(n * DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const md = n => { const d = new Date(n * DAY); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}`; };
const dow = n => new Date(n * DAY).getUTCDay();
const ym = n => { const d = new Date(n * DAY); return [d.getUTCFullYear(), d.getUTCMonth()]; };
const monthEnd = n => { const [y, m] = ym(n); return Date.UTC(y, m + 1, 0) / DAY; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const WEEKDAY = '日一二三四五六';

// 合約 365 天；排期表固定 12 個月（從開始日的月份起），排程要在第 12 個月月底（L）前走完。
// 週次從第一個週一起算，只用完整的週；不足一週的天數先排在最前面（front），再排最後面（tail）。
function windowInfo() {
  if (!state.start) return null;
  const s = parse(state.start), e = s + 364;
  const [y0, m0] = ym(s);
  const months = Array.from({ length: 12 }, (_, i) => [y0 + Math.floor((m0 + i) / 12), (m0 + i) % 12]);
  const L = Math.min(e, Date.UTC(y0, m0 + 12, 0) / DAY);
  const d = dow(s), first = d === 1 ? s : s + (8 - d) % 7;
  const weeks = [];
  for (let w = first; w + 6 <= L; w += 7) weeks.push({ s: w, e: w + 6 });
  const lastEnd = weeks.length ? weeks[weeks.length - 1].e : first - 1;
  const front = first > s ? { s, e: first - 1 } : null;
  const tail = lastEnd < L ? { s: lastEnd + 1, e: L } : null;
  return { s, e, L, first, weeks, full: weeks, front, tail, days: L - s + 1, months };
}
const monthIdx = (W, n) => { const [y, m] = ym(n); return W.months.findIndex(x => x[0] === y && x[1] === m); };

const workLabel = id => { const i = state.works.findIndex(w => w.id === id); return i < 0 ? '（作品已刪除）' : (state.works[i].name.trim() || `作品${letter(i)}`); };
const regionLabel = id => { const r = state.regions.find(x => x.id === id); return r ? (r.name.trim() || '（未命名區域）') : '（區域已刪除）'; };

/* ================= 自動排程 ================= */
// 作品 × 區域的組合，交錯排列讓作品和區域都會輪到
function interleave(works, regions) {
  const nW = works.length, nR = regions.length, L = nW * nR / gcd(nW, nR), out = [];
  for (let i = 0; i < nW * nR; i++) out.push({ work: works[i % nW].id, region: regions[(i % nR + Math.floor(i / L)) % nR].id });
  return out;
}
function mergeSegs(segs) {
  segs.sort((a, b) => (a.work || '').localeCompare(b.work || '') || a.region.localeCompare(b.region) || a.s - b.s);
  const out = [];
  for (const g of segs) {
    const last = out[out.length - 1];
    if (last && last.work === g.work && last.region === g.region && last.e + 1 === g.s) last.e = g.e;
    else out.push({ ...g });
  }
  return out;
}

// 置頂類：1次 = 1組（作品×區域）× 1天
// 以「段」為單位排：入門／標準一段 7 天；加強一段 14 天、旗艦一段 28 天，每段結束換下一組。
// 段從第一個週一起算；除不盡的天數先排最前面，再用一段沒用到的段，最後才用月底剩的幾天。
function genPin(item, W, works, regions) {
  const combos = item.type === 'work' ? interleave(works, regions) : regions.map(r => ({ work: null, region: r.id }));
  const C = combos.length, T = item.total, warns = [];
  if (!C) return { segs: [], warns: [item.type === 'work' ? '需要至少 1 個作品和 1 個區域' : '需要至少 1 個區域'] };
  const U = item.block || 7, len = r => r ? r.e - r.s + 1 : 0;
  const slots = [];
  for (let s0 = W.first; s0 + U - 1 <= W.L; s0 += U) slots.push({ s: s0, e: s0 + U - 1 });
  const F = slots.length, lastEnd = F ? slots[F - 1].e : W.first - 1;
  const tail = lastEnd < W.L ? { s: lastEnd + 1, e: W.L } : null;
  let k = Math.min(C, Math.ceil(T / W.days));
  if (C * W.days < T) {
    k = C;
    warns.push(`組合不足，還有 ${T - C * W.days} 次用不完（目前 ${C} 組，每組最多 ${W.days} 天）。建議增加${item.type === 'work' ? '作品或區域' : '區域'}。`);
  }
  // 整段平均分給 k 條同時進行的線；剩下的天數依序塞進各線的空檔
  const totalUnits = Math.min(Math.floor(T / U), k * F);
  const units = Array.from({ length: k }, (_, l) => Math.floor(totalUnits / k) + (l < totalUnits % k ? 1 : 0));
  let rest = Math.min(T, k * W.days) - totalUnits * U;
  const segs = []; let dropped = 0;
  const add = (s, e, c) => segs.push({ s, e, work: c.work, region: c.region });
  for (let l = 0; l < k; l++) {
    const lane = combos.filter((_, i) => i % k === l), q = units[l];
    const even = state.opts.pinMode === 'even' && q < F;
    const used = Array.from({ length: q }, (_, i) => even ? Math.floor(i * F / q) : i);
    // 有設定段長的（加強／旗艦）：所有組合一起輪，第 si 段第 l 條線用第 (si×k + l) 組，同一段內不會重複
    // 以週為單位的（入門／標準）：每條線固定幾組，連續排時同一組排成一長段
    const pick = (si, i) => item.block ? combos[(si * k + l) % C]
      : even ? lane[i % lane.length] : lane[Math.min(lane.length - 1, Math.floor(i * lane.length / Math.max(q, 1)))];
    used.forEach((si, i) => add(slots[si].s, slots[si].e, pick(si, i)));
    let pieces = q;
    if (rest > 0 && W.front) { const x = Math.min(rest, len(W.front)); add(W.first - x, W.first - 1, pick(used[0] ?? 0, 0)); rest -= x; pieces++; }
    if (rest > 0 && q < F) {
      const free = even ? slots.findIndex((_, si) => !used.includes(si)) : q, x = Math.min(rest, U);
      add(slots[free].s, slots[free].s + x - 1, pick(free, Math.max(q - 1, 0))); rest -= x; pieces++;
    }
    if (rest > 0 && tail) { const x = Math.min(rest, len(tail)); add(tail.s, tail.s + x - 1, pick(F, Math.max(q - 1, 0))); rest -= x; pieces++; }
    if (!item.block && lane.length > pieces) dropped += lane.length - pieces;
  }
  if (item.block) { const n = Math.min(C, totalUnits + (T > totalUnits * U ? k : 0)); if (n < C) dropped = C - n; }
  if (dropped) warns.push(`組合太多，有 ${dropped} 組排不到（權益只夠排到前面的組合）。`);
  // 有段長的保留每一段（排期表一段寫一次）；以週為單位的把相連的週合併成一長段
  return { segs: item.block ? segs.sort((a, b) => a.s - b.s) : mergeSegs(segs), warns };
}

// 品牌曝光類：1週 = 1個區域 × 1週；切成 chunks 段，每段輪一組
function genExpo(item, j, m, cursor, W, works, regions) {
  const warns = [];
  let combos;
  if (item.type === 'work') {
    const ws = item.max ? works.slice(0, item.max) : works;
    if (item.max && works.length > item.max) warns.push(`此版位最多 ${item.max} 個作品，只使用前 ${item.max} 個。`);
    combos = ws.length && regions.length ? interleave(ws, regions) : [];
  } else {
    const rs = item.max ? regions.slice(0, item.max) : regions;
    if (item.max && regions.length > item.max) warns.push(`此版位最多 ${item.max} 個縣市，只使用前 ${item.max} 個。`);
    combos = rs.map(r => ({ work: null, region: r.id }));
  }
  if (!combos.length) return { segs: [], warns: [item.type === 'work' ? '需要至少 1 個作品和 1 個區域' : '需要至少 1 個區域'] };
  const N = W.full.length, c = item.chunks, L = item.total / c, segs = [];
  const P = N / c, offset = state.opts.expoStagger === 'stagger' ? Math.floor(j * P / m) : 0;
  for (let i = 0; i < c; i++) {
    let start;
    if (state.opts.expoMode === 'even') start = Math.min(Math.floor(i * P) + offset, N - L);
    else start = (state.opts.expoStagger === 'stagger' ? cursor : 0) + i * L;
    const combo = combos[(j + i) % combos.length];
    for (let t = 0; t < L; t++) {
      const wk = W.full[(start + t) % N];
      segs.push({ s: wk.s, e: wk.e, work: combo.work, region: combo.region });
    }
  }
  return { segs: mergeSegs(segs), warns };
}

function generateAll() {
  const W = windowInfo(), works = validWorks(), regions = validRegions();
  const entries = [], genWarns = {};
  const expoItems = schedItems().filter(i => i.kind === 'expo');
  let cursor = 0;
  for (const item of schedItems()) {
    let r;
    if (item.kind === 'pin') r = genPin(item, W, works, regions);
    else {
      const j = expoItems.indexOf(item);
      r = genExpo(item, j, expoItems.length, cursor, W, works, regions);
      cursor += item.total;
    }
    r.segs.forEach(g => entries.push({ id: uid(), item: item.key, start: fmt(g.s), end: fmt(g.e), work: g.work, region: g.region }));
    if (r.warns.length) genWarns[item.key] = r.warns;
  }
  state.entries = entries; state.genWarns = genWarns; state.generated = true;
  state.aiPicks = defaultAiPicks(); state.pushPicks = defaultPushPicks();
  state.scheduledFor = { plan: state.plan, start: state.start };
}

/* ================= 用量計算與檢查 ================= */
const entryDays = e => parse(e.end) - parse(e.start) + 1;
function usage(item) {
  const days = state.entries.filter(e => e.item === item.key).reduce((s, e) => s + Math.max(0, entryDays(e)), 0);
  return item.kind === 'pin' ? days : days / 7;
}
const unitName = item => item.kind === 'pin' ? '次' : '週';
const numStr = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
function statusOf(item) {
  const u = usage(item), t = item.total;
  if (Math.abs(u - t) < 1e-9) return { cls: 'ok', text: '剛好用完' };
  if (u < t) return { cls: 'under', text: `剩 ${numStr(t - u)} ${unitName(item)}` };
  return { cls: 'over', text: `超用 ${numStr(u - t)} ${unitName(item)}` };
}
function entryProblems(e, W) {
  const p = [];
  const item = itemByKey(e.item);
  if (parse(e.end) < parse(e.start)) p.push('結束日早於開始日');
  if (W && (parse(e.start) < W.s || parse(e.end) > W.L)) p.push('超出排期表的 12 個月');
  if (!state.regions.some(r => r.id === e.region)) p.push('區域已刪除');
  if (item && item.type === 'work' && !state.works.some(w => w.id === e.work)) p.push('作品已刪除');
  const clash = state.entries.some(o => o !== e && o.item === e.item && o.region === e.region && (o.work || '') === (e.work || '')
    && parse(o.start) <= parse(e.end) && parse(e.start) <= parse(o.end));
  if (clash) p.push('同一組合日期重疊');
  return p;
}

const aiItem = () => planRows().find(r => r.kind === 'ai');

function defaultPushPicks() {

    <table class="info-table" style="margin-top:10px"><thead><tr><th>權益</th><th>數量</th><th>說明</th></tr></thead><tbody>${body}</tbody></table></div>`;

/* 月份總覽（與 Excel 同一份資料） */
const workLink = id => ((state.works.find(w => w.id === id) || {}).link || '').trim();
function cellTexts(it, W, withLink) {
  const cells = W.months.map(() => []);
  for (const e of state.entries.filter(x => x.item === it.key)) {
    const s = parse(e.start), en = parse(e.end);
    if (en < s) continue;
    const pieces = [];
    // 以週為單位的長段置頂按月切開；加強／旗艦的 14、28 天一段，整段寫在開始的月份
    if (it.kind === 'pin' && !it.block) { let c = s; while (c <= en) { const pe = Math.min(en, monthEnd(c)); pieces.push([c, pe]); c = pe + 1; } }
    else pieces.push([s, en]);
    for (const [ps, pe] of pieces) {
      const mi = monthIdx(W, ps);
      if (mi >= 0) cells[mi].push({ s: ps, e: pe, r: regionLabel(e.region), w: it.type === 'work' ? workLabel(e.work) : '', link: it.type === 'work' ? workLink(e.work) : '' });
    }
  }
  return cells.map(list => {
    list.sort((a, b) => a.s - b.s || a.e - b.e || a.r.localeCompare(b.r) || a.w.localeCompare(b.w));
    if (it.kind !== 'pin') return list.map(x => [x.r, `${md(x.s)}-${md(x.e)}`, x.w, withLink ? x.link : ''].filter(Boolean).join('\n')).join('\n\n');
    // 置頂類同一個月常有好幾組同時在跑：同一段走期只寫一次，下面每組一行（縣市｜作品）；連結統一列在表頭的作品清單
    const groups = [];
    list.forEach(x => {
      const g = groups[groups.length - 1];
      if (g && g.s === x.s && g.e === x.e) g.items.push(x); else groups.push({ s: x.s, e: x.e, items: [x] });
    });
    return groups.map(g => {
      const head = `${md(g.s)}-${md(g.e)} (${g.e - g.s + 1}天)`;
      if (it.type !== 'work') return [head, g.items.map(x => x.r).join('、')].join('\n');
      const byRegion = new Map();
      g.items.forEach(x => { if (!byRegion.has(x.r)) byRegion.set(x.r, []); byRegion.get(x.r).push(x.w); });
      return [head, ...[...byRegion].map(([r, ws]) => `${r}｜${ws.join('、')}`)].join('\n');
    }).join('\n\n');
  });
}
function monthCells(row, W, withLink) {
  if (row.kind === 'pin' || row.kind === 'expo') return cellTexts(row, W, withLink);
  if (row.kind === 'push') { const c = W.months.map(() => ''); pushList(row, W).forEach(x => c[x.mi] = x.text); return c; }
  return null;
}
function gridHTML(W) {
  const head = `<tr><th class="sticky">權益</th><th>數量</th>${W.months.map(([y, m]) => `<th>${y}/${m + 1}</th>`).join('')}</tr>`;
  const body = planGroups().map(g => {
    const rows = g.rows.filter(r => r.kind !== 'info');
    if (!rows.length) return '';
    return `<tr><td class="sticky cat">${esc(g.cat)}</td><td class="cat" colspan="${W.months.length + 1}"></td></tr>` + rows.map(r => {
      const cells = monthCells(r, W);
      const tds = cells ? cells.map(t => `<td>${esc(t)}</td>`).join('') : `<td colspan="${W.months.length}">${esc(aiList(r).join(' / '))}</td>`;
      return `<tr><td class="sticky">${esc(r.name)}</td><td>${esc(r.qty)}</td>${tds}</tr>`;
    }).join('');
  }).join('');
  return `<div class="gridwrap"><table class="mgrid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="hint" style="margin-top:8px">只列出需要排程或填作品的權益；完整格式（含說明、素材提供）請按「匯出 Excel」。</div>`;
}

  if (e.target.dataset.push !== undefined) { state.pushPicks[+e.target.dataset.push] = e.target.value; markDirty(); renderResult(); return; }
  if (e.target.dataset.ai !== undefined) { state.aiPicks[+e.target.dataset.ai] = e.target.value; markDirty(); renderResult(); return; }
  const t = e.target, id = t.dataset.eid; if (!id) return;
  const en = state.entries.find(x => x.id === id);
  en[t.dataset.f] = t.value;
  if (t.dataset.f === 'start' && en.end && parse(en.end) < parse(en.start)) en.end = en.start;
  markDirty(); renderResult();
});
$('#resultBody').addEventListener('click', e => {
  if (e.target.closest('[data-demo]')) {
    Object.assign(state, {
      company: '範例設計（示範資料）', sales: '業務姓名', plan: '標準版', start: fmt(parse(new Date().toISOString().slice(0, 10))),
      works: [{ id: uid(), name: '範例作品一', link: '' }, { id: uid(), name: '範例作品二', link: '' }],
      regions: [{ id: uid(), name: '台中市' }, { id: uid(), name: '彰化縣' }],
    });
    generateAll(); markDirty(); renderAll();
    $('#runMsg').innerHTML = '<div class="notice info">已載入示範資料。換成客戶的資料後，再按一次「一鍵自動排程」即可。</div>';
    return;
  }
  const del = e.target.closest('[data-delentry]');
  if (del) { state.entries = state.entries.filter(x => x.id !== del.dataset.delentry); markDirty(); renderResult(); return; }
  const add = e.target.closest('[data-addentry]');
  if (add) {
    const W = windowInfo(), it = itemByKey(add.dataset.addentry);
    if (!W || !state.regions.length) { toast('請先填合約開始日和門市區域', 'err'); return; }
    const s = W.first;
    state.entries.push({ id: uid(), item: it.key, start: fmt(s), end: fmt(s + 6), region: (validRegions()[0] || state.regions[0]).id,
      work: it.type === 'work' ? (validWorks()[0] || state.works[0] || {}).id || null : null });
    markDirty(); renderResult();
  }
});

/* ================= 存檔／讀檔 ================= */
// 在網頁連結版用平台的下載功能；直接開 HTML 檔時用一般下載
let dlCap;
async function download(blob, name) {
  if (window.claude?.use) {
    if (dlCap === undefined) dlCap = await window.claude.use('downloads');
    if (dlCap) {
      try { await dlCap.save({ filename: name, data: blob }); return true; }
      catch (err) {
        if (err?.code !== 'declined') toast('無法下載檔案：' + (err?.message || err?.code || '未知錯誤'), 'err');
        return false;
      }
    }
    // 在網頁連結裡，平台下載功能不能用時，一般下載也會被擋，要明確告訴業務
    toast('目前的檢視方式無法下載檔案。請先登入 Claude 再打開這個連結，或改用本機的 HTML 檔。', 'err');
    return false;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}
const safeName = s => (s || '未命名').replace(/[\\/:*?"<>|]/g, '_');
$('#btnSave').onclick = async () => {
  const data = { app: 'store-plan-scheduler', version: 1, savedAt: new Date().toISOString(), state };
  if (await download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `${safeName(state.company)}－${state.plan}排期.json`)) dirty = false;
};
$('#btnLoad').onclick = async () => {
  if (dirty && !(await ask('目前的資料還沒存檔，讀檔會覆蓋，確定嗎？', '讀檔'))) return;
  $('#fileLoad').click();
};
$('#fileLoad').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'store-plan-scheduler' || !data.state || !PLANS[data.state.plan]) throw new Error('格式不符');
    state = { ...state, ...data.state, opts: { ...state.opts, ...data.state.opts } };
    dirty = false; $('#runMsg').innerHTML = '';
    renderAll();
  } catch (err) { toast('讀檔失敗：這不是本工具存的檔案（' + err.message + '）', 'err'); }
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ================= 匯出 Excel（範本格式） ================= */
function b64ToBuf(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
const normName = s => String(s || '').replace(/横/g, '橫').replace(/\s+/g, '');
async function buildWorkbook() {
  const W = windowInfo();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(b64ToBuf(PLAN_TEMPLATE_B64));
  const ws = wb.getWorksheet(state.plan + '_範本');
  wb.worksheets.filter(x => x !== ws).forEach(x => wb.removeWorksheet(x.id));
  ws.name = state.plan;   // 使用說明：工作表名稱刪掉「範本」
  wb.views = [{ x: 0, y: 0, width: 20000, height: 12000, firstSheet: 0, activeTab: 0, visibility: 'visible' }];

  const MC = 7;           // 月份從 G 欄開始，共 12 欄（G～R）
  const colW = c => ws.getColumn(c).width || ws.properties.defaultColWidth || 12.63;
  const vlen = s => [...s].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
  const linesFor = (text, width) => String(text ?? '').split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(vlen(l) / Math.max(1, width - 1))), 0);
  const fit = (r, text, width) => {
    const row = ws.getRow(r), need = Math.min(409, linesFor(text, width) * 15 + 6);
    if (!row.height || row.height < need) row.height = need;
  };
  // 有填內容的格子：自動換行、一般黑字（範本有些格子帶超連結的藍字底線樣式）
  const plain = cell => {
    cell.alignment = { ...(cell.alignment || {}), wrapText: true, vertical: 'top' };
    cell.font = { ...(cell.font || {}), underline: false, color: { argb: 'FF000000' } };
  };
  const mergeSpan = (r, c) => {
    const cell = ws.getCell(r, c);
    if (!cell.isMerged) return null;
    const m = cell.master, same = (rr, cc) => { const x = ws.getCell(rr, cc); return x.isMerged && x.master.address === m.address; };
    let bottom = m.row, right = m.col;
    while (same(bottom + 1, m.col)) bottom++;
    while (same(m.row, right + 1)) right++;
    return { top: m.row, left: m.col, bottom, right };
  };

  // 表頭：公司、門店縣市、排期、業務；月份
  const regs = validRegions().map(r => r.name.trim());
  let hr = 0;
  for (let r = 1; r <= 12 && !hr; r++) {
    const label = ws.getCell(r, 1).text.trim(), b = ws.getCell(r, 2);
    if (label === '公司ID' || label === '公司名稱') b.value = state.company;
    else if (label === '門店所在縣市') b.value = `${regs.length}個門店：${regs.join('、')}`;
    else if (label === '廣告排期') b.value = `${fmt(W.s)}~${fmt(W.e)}`;
    else if (label === '負責業務') b.value = state.sales;
    if (ws.getCell(r, 4).text.trim() === '權益數量') hr = r;
  }
  if (!hr) throw new Error('範本格式不符');
  W.months.forEach(([y, m], i) => { ws.getCell(hr, MC + i).value = new Date(Date.UTC(y, m, 1)); });

  // 表頭右邊（G～R、月份標題上方）：作品清單和連結，跟一二設計那份的放法一樣
  const top = hr - 2, works = validWorks();
  if (top >= 1 && works.length) {
    const text = '作品清單（客戶提供）\n' + works.map(w => `作品${letter(state.works.indexOf(w))}：${w.name.trim()}｜${w.link.trim() || '連結待補'}`).join('\n');
    ws.mergeCells(1, MC, top, MC + 11);
    const c = ws.getCell(1, MC);
    c.value = text;
    c.font = { name: 'Arial', size: 10, color: { argb: 'FF000000' } };
    c.alignment = { wrapText: true, vertical: 'top', horizontal: 'left' };
    const width = Array.from({ length: 12 }, (_, i) => colW(MC + i)).reduce((a, b) => a + b, 0);
    const per = Math.ceil((linesFor(text, width) * 15 + 6) / top);
    for (let r = 1; r <= top; r++) { const row = ws.getRow(r); if (!row.height || row.height < per) row.height = per; }
  }

  // 權益列：用 B 欄名稱對應
  const defs = new Map(planRows().map(d => [normName(d.name), d]));
  for (let r = hr + 1; r <= ws.rowCount; r++) {
    const def = defs.get(normName(ws.getCell(r, 2).text));
    if (!def || def.kind === 'info') continue;
    const descText = [ws.getCell(r, 5).text, ws.getCell(r, 6).text];
    let span = mergeSpan(r, MC);
    // 範本裡月份欄合併的格子（旗艦版的置頂、和 FB/IG 合併的 APP推播）拆成 12 格，跟其他權益一樣逐月填
    if (def.kind !== 'ai' && span) {
      const master = ws.getCell(span.top, span.left), saved = master.value, style = JSON.stringify(master.style);
      ws.unMergeCells(span.top, span.left, span.bottom, span.right);
      if (r > span.top) { ws.mergeCells(span.top, span.left, r - 1, span.right); ws.getCell(span.top, span.left).value = saved; }
      if (r < span.bottom) ws.mergeCells(r + 1, span.left, span.bottom, span.right);
      for (let c = span.left; c <= span.right; c++) { const x = ws.getCell(r, c); x.style = JSON.parse(style); x.value = null; }
      span = null;
    }
    if (def.kind === 'ai') {
      const target = span ? ws.getCell(span.top, span.left) : ws.getCell(r, MC);
      const text = aiPicks(def).map((id, i) => { const n = aiName(id), l = n === '待補' ? '' : workLink(id); return `${i + 1}. ${n}${l ? '　' + l : ''}`; }).join('\n');
      target.value = text; plain(target);
      if (!span || span.bottom === span.top) fit(r, text, span ? Array.from({ length: span.right - span.left + 1 }, (_, i) => colW(span.left + i)).reduce((a, b) => a + b, 0) : colW(MC));
      continue;
    }
    monthCells(def, W, true).forEach((t, i) => {
      const cell = ws.getCell(r, MC + i);
      cell.value = t || null;
      if (t) { plain(cell); fit(r, t, colW(MC + i)); }
    });
    descText.forEach((t, i) => t && fit(r, t, colW(5 + i)));
  }
  return wb;
}
$('#btnExport').onclick = async () => {
  if (!state.generated) { toast('請先按「一鍵自動排程」', 'err'); return; }
  if (!windowInfo()) { toast('請先填合約開始日', 'err'); return; }
  if (typeof ExcelJS === 'undefined') { toast('匯出 Excel 需要網路連線（載入 Excel 元件失敗），請連上網路後重新整理頁面。', 'err'); return; }
  let buf;
  try { buf = await (await buildWorkbook()).xlsx.writeBuffer(); }
  catch (err) { toast('產生 Excel 失敗：' + (err?.message || err), 'err'); return; }
  download(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
    `${safeName(state.company)}－100店鋪方案${state.plan}.xlsx`);
};

function renderAll() { renderBasics(); renderWorks(); renderRegions(); renderResult(); }
renderAll();
</script>
